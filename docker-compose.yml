version: '3'
services:
  web:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./misc/data:/app/misc/data
      - flask_session_data:/app/flask_session
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DEBUG=${DEBUG:-false}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-julies_demiplane_session}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - GUNICORN_LIMIT_REQUEST_FIELD_SIZE=${GUNICORN_LIMIT_REQUEST_FIELD_SIZE:-16384}
      - GUNICORN_LIMIT_REQUEST_FIELDS=${GUNICORN_LIMIT_REQUEST_FIELDS:-100}
      - HEADER_MONITOR_ENABLED=${HEADER_MONITOR_ENABLED:-true}
      - HEADER_SIZE_WARN_BYTES=${HEADER_SIZE_WARN_BYTES:-12288}
      - HEADER_WARN_RATE_THRESHOLD_PCT=${HEADER_WARN_RATE_THRESHOLD_PCT:-2}
      - HEADER_MONITOR_WINDOW=${HEADER_MONITOR_WINDOW:-200}
      - HEADER_MONITOR_LOG_EVERY=${HEADER_MONITOR_LOG_EVERY:-100}
      - REQUEST_FORM_LOG_ENABLED=${REQUEST_FORM_LOG_ENABLED:-true}
      - REQUEST_FORM_LOG_INCLUDE_GET=${REQUEST_FORM_LOG_INCLUDE_GET:-true}
      - REQUEST_FORM_LOG_INCLUDE_ENDPOINT=${REQUEST_FORM_LOG_INCLUDE_ENDPOINT:-false}
      - REQUEST_FORM_LOG_INCLUDE_HTMX=${REQUEST_FORM_LOG_INCLUDE_HTMX:-false}
      - REQUEST_FORM_LOG_INCLUDE_VALUES=${REQUEST_FORM_LOG_INCLUDE_VALUES:-false}
      - REQUEST_FORM_LOG_MAX_VALUE_LEN=${REQUEST_FORM_LOG_MAX_VALUE_LEN:-160}

volumes:
  flask_session_data: