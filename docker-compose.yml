version: '3'
services:
  web:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./misc/data:/app/misc/data
      - flask_session_data:/app/flask_session
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DEBUG=${DEBUG:-true}

volumes:
  flask_session_data: