{% if field_type != "hidden" %}
    <label for="{{ table }}-{{ field }}">{{ field }}</label>
{% endif %}

{% if field_type == "select" %}
    <select id="{{ table }}-{{ field }}" name="{{ table }}-{{ field }}">
        {{ options | safe }}
        <option value="{{ option }}">{{ option }}</option>
    </select>
{% else %}
    <input type="{{ field_type }}" id="{{ table }}-{{ field }}" name="{{ table }}-{{ field }}" value="{{ field_value }}">
{% endif %}
{% if field_type != "hidden" %}
    <br>
{% endif %}
