{# Tracker page — inline full-page tracker management (no modal). #}
<form id="tracker-csrf-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="tracker-section">
    <h4>Trackers</h4>

    {% if trackers %}
    {% for tracker in trackers %}
    {% include 'components/tracker_item.html' %}
    {% endfor %}
    {% endif %}

    {# ── Add tracker — + button reveals inline form ── #}
    <div class="tracker-add-actions-row" id="tracker-add-tracker-row">
        <div class="add-actions-field section-action-field" id="add-tracker-btn-wrapper">
            <button type="button" id="add-tracker-btn" class="add-actions-btn section-action-btn">+</button>
            <label class="add-actions-label section-action-label">Add Tracker</label>
        </div>

        <div class="add-actions-field tracker-add-tracker-name-field" id="add-tracker-field-name" style="display:none;">
            <label for="add-tracker-name-input" class="add-actions-label">Tracker Name</label>
            <input type="text" class="add-actions-input" id="add-tracker-name-input" name="add-tracker-name-input" placeholder="Tracker name…" maxlength="60">
        </div>
        <div class="add-actions-field section-action-field" id="add-tracker-submit-wrapper" style="display:none;">
            <button type="button" class="add-actions-btn section-action-btn"
                    id="add-tracker-submit-btn"
                    hx-post="/characters/{{ character_id }}/tracker/add"
                    hx-target="#tracker-page-container"
                    hx-swap="innerHTML"
                    hx-include="closest form"
                    aria-label="Add tracker"><i class="bi bi-check-lg"></i></button>
            <label class="add-actions-label section-action-label">Add</label>
        </div>
        <div class="add-actions-field section-action-field" id="add-tracker-close-wrapper" style="display:none;">
            <button type="button" id="add-tracker-close-btn" class="add-actions-btn section-action-btn">&times;</button>
            <label class="add-actions-label section-action-label">Close</label>
        </div>
    </div>

</div>
</form>
