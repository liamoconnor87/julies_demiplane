<div class="card-item-section inventory-section">
    <h4>
        Inventory
        <span id="inventory-lock-toggle" class="section-lock-toggle" role="button" tabindex="0" aria-pressed="false" aria-label="Unlocked"><i class="bi bi-unlock-fill" aria-hidden="true"></i></span>
    </h4>

    {% if inventory %}
        {% for item in inventory %}
            <div class="card-item-row card-item-saved-row">
                <div class="card-item-top-row">
                    <div class="card-item-field card-item-name-field">
                        <label for="inventory-name-{{ item.id }}" class="card-item-label">Item(s)</label>
                        <input type="text" id="inventory-name-{{ item.id }}"
                            name="inventory-name-{{ item.id }}" value="{{ item.name }}" readonly class="card-item-input">
                    </div>

                    <div class="card-item-field card-item-quantity-field">
                        <label for="inventory-quantity-{{ item.id }}" class="card-item-label">Qty</label>
                            <div class="card-item-quantity-control" aria-label="Adjust quantity for {{ item.name }}">
                                <button type="button" id="inventory-decrease-{{ item.id }}" class="card-item-btn card-item-quantity-btn" data-inventory-remove="true"
                                    hx-post="/characters/{{ character_id }}/inventory/fragment"
                                    hx-target="#inventory-section-container"
                                    hx-swap="innerHTML"
                                    hx-include="closest form"
                                    hx-vals='{"inventory-action":"step","inventory-update-id":"{{ item.id }}","inventory-step":"-1"}'>−</button>
                                <input type="number" id="inventory-quantity-{{ item.id }}"
                                    name="inventory-quantity-{{ item.id }}" value="{{ item.quantity }}" class="card-item-input card-item-quantity-display" min="0" readonly>
                                <button type="button" id="inventory-increase-{{ item.id }}" class="card-item-btn card-item-quantity-btn" data-inventory-remove="true"
                                    hx-post="/characters/{{ character_id }}/inventory/fragment"
                                    hx-target="#inventory-section-container"
                                    hx-swap="innerHTML"
                                    hx-include="closest form"
                                    hx-vals='{"inventory-action":"step","inventory-update-id":"{{ item.id }}","inventory-step":"1"}'>+</button>
                            </div>
                    </div>

                </div>

                {% if item.description %}
                    <div class="card-item-field card-item-description-field">
                        <div id="inventory-description-{{ item.id }}" class="card-item-description-display">{{ item.description }}</div>
                    </div>
                {% endif %}
            </div>
        {% endfor %}
    {% endif %}

    {% if not inventory_at_capacity %}
    <div class="card-item-row card-item-add-row">
        <div class="card-item-top-row">
            <div class="card-item-field card-item-action-field section-action-field" id="add-inventory-btn-wrapper">
                <button type="button" id="add-inventory-btn" class="card-item-btn section-action-btn">+</button>
                <label for="add-inventory-btn" class="card-item-label section-action-label">Add Item</label>
            </div>

            <div class="card-item-field card-item-name-field" id="add-inventory-field-name">
                <label for="inventory-name" class="card-item-label">New Item</label>
                <input type="text" id="inventory-name" name="inventory-name" placeholder="Enter item" class="card-item-input">
            </div>

            <div class="card-item-field card-item-quantity-field" id="add-inventory-field-quantity">
                <label for="inventory-quantity" class="card-item-label">Qty</label>
                <input type="number" id="inventory-quantity" name="inventory-quantity" value="1" min="0" class="card-item-input">
            </div>

            <div class="card-item-field card-item-action-field section-action-field" id="add-inventory-submit-btn-wrapper">
                <button type="button" id="inventory-add" class="card-item-btn section-action-btn"
                    name="inventory-action"
                    value="add"
                    hx-post="/characters/{{ character_id }}/inventory/fragment"
                    hx-target="#inventory-section-container"
                    hx-swap="innerHTML"
                    hx-include="closest form"><i class="bi bi-check-lg"></i></button>
                <label for="inventory-add" class="card-item-label section-action-label">Add</label>
            </div>

            <div class="card-item-field card-item-action-field section-action-field" id="close-inventory-btn-wrapper">
                <button type="button" id="close-inventory-field-x-btn" class="card-item-btn section-action-btn">×</button>
                <label for="close-inventory-field-x-btn" class="card-item-label section-action-label">Close</label>
            </div>
        </div>

        <div class="card-item-field card-item-description-field" id="add-inventory-field-description">
            <label for="inventory-description" class="card-item-label">Description</label>
            <textarea id="inventory-description" name="inventory-description" rows="2" placeholder="Enter description" class="card-item-input card-item-description-input"></textarea>
        </div>
    </div>
    {% endif %}
</div>
