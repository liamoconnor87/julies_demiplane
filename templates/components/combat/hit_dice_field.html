{# Single Hit Dice field's inner content — pass char_class in context.
   Caller supplies the wrapping element (with id/data-class-id/data-hit-dice-max). #}
<div class="field-input hit-dice-display" id="hit-dice-display-{{ char_class.id }}">
    <span class="hit-dice-remaining" id="hit-dice-remaining-{{ char_class.id }}">{{ char_class.level }}</span>d{{ hit_die_mapping.get(char_class.class_name, 8) }}
</div>
<div class="hit-dice-stepper-row">
    <button type="button" class="hit-dice-step-btn" data-hit-dice-step="-1" aria-label="Use a {{ char_class.class_name | title }} hit die">&minus;</button>
    <span class="hit-dice-label">{{ char_class.class_name | title }}</span>
    <button type="button" class="hit-dice-step-btn" data-hit-dice-step="1" aria-label="Regain a {{ char_class.class_name | title }} hit die">+</button>
</div>
