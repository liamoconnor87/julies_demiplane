<div class="combat-section">
    <h4>Combat</h4>
    <p class="section-help-text">Manage HP, Temp HP, and Hit Dice. Use +/− to adjust Current HP during encounters.</p>
    <div class="combat-section-layout-row">
        <div class="combat-section-col-one">
            <div class="combat-section-col-one-field">
                <label for="character-health_points" class="field-label combat-section-label">Health Points</label>
                <input type="number" id="character-health_points" name="character-health_points" value="{{ character.health_points or '' }}" class="field-input combat-section-input">
            </div>

            <div class="combat-section-col-one-field">
                <label for="character-temporary_hit_points" class="field-label combat-section-label">Temp HP</label>
                <input type="text" id="character-temporary_hit_points" name="character-temporary_hit_points" value="{{ character.temporary_hit_points if character.temporary_hit_points else '--' }}" class="field-input combat-section-input">
            </div>

            <div class="combat-section-col-one-field">
                <label for="character-hit_dice" class="field-label combat-section-label">Hit Dice</label>
                <input type="text" id="character-hit_dice" name="character-hit_dice" value="{{ character.hit_dice or '' }}" class="field-input combat-section-input">
            </div>
        </div>

        <div class="combat-section-col-two-field">
            <input type="number" id="character-current_health_points" name="character-current_health_points" value="{{ character.current_health_points or '' }}" class="field-input combat-section-input">
            <div class="combat-section-current-hp-controls" aria-label="Adjust current HP">
                <button type="button" id="decrease-current-hp-btn" class="combat-section-btn combat-section-current-hp-btn" aria-label="Decrease current HP">-</button>
                <button type="button" id="increase-current-hp-btn" class="combat-section-btn combat-section-current-hp-btn" aria-label="Increase current HP">+</button>
            </div>
            <label for="character-current_health_points" class="field-label combat-section-label">Current HP</label>
        </div>
    </div>
</div>
