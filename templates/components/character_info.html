{# Character Basic Information Component #}
<h4>Character</h4>
<div class="row">
    {# Hidden ID field #}
    <input type="hidden" id="character-id" name="character-id" value="{{ character.id or '' }}">

    <div class="char-info-row">
        {# Name #}
        <div class="char-info-field">
            <label for="character-name">Name</label>
            <input type="text" id="character-name" name="character-name" value="{{ character.name or '' }}" class="fixed-input">
        </div>
        {# Level (calculated, disabled) #}
        <div class="char-info-field level-square character-level-field">
            <input type="number" id="character-level" name="character-level" value="{{ character.level or '' }}" disabled class="fixed-input">
            <label for="character-level">Level</label>
        </div>
        {# Race #}
        <div class="char-info-field character-race-field character-main-text-field">
            <label for="character-race">Race</label>
            <input type="text" id="character-race" name="character-race" value="{{ character.race or '' }}" class="fixed-input">
        </div>
        {# Background #}
        <div class="char-info-field character-main-text-field">
            <label for="character-background">Background</label>
            <input type="text" id="character-background" name="character-background" value="{{ character.background or '' }}" class="fixed-input">
        </div>
        {# Alignment #}
        <div class="char-info-field character-main-text-field">
            <label for="character-alignment">Alignment</label>
            <input type="text" id="character-alignment" name="character-alignment" value="{{ character.alignment or '' }}" class="fixed-input">
        </div>
    </div>
    <div class="stats-row">
        {# Armour Class #}
        <div class="level-square">
            <input type="number" id="character-armour_class" name="character-armour_class" value="{{ character.armour_class or '' }}" class="fixed-input">
            <label for="character-armour_class">Armour Class</label>
        </div>

        {# Initiative #}
        <div class="level-square">
            <input type="number" id="character-initiative" name="character-initiative" value="{{ character.initiative or '' }}" class="fixed-input">
            <label for="character-initiative">Initiative</label>
        </div>

        {# Speed #}
        <div class="level-square">
            <input type="number" id="character-speed" name="character-speed" value="{{ character.speed or '' }}" class="fixed-input">
            <label for="character-speed">Speed</label>
        </div>

        {# Proficiency Bonus #}
        <div class="level-square">
            <input type="number" id="character-proficiency" name="character-proficiency" value="{{ character.proficiency or '' }}" class="fixed-input">
            <label for="character-proficiency">Proficiency</label>
        </div>

        {# Passive Wisdom #}
        <div class="level-square">
            <input type="number" id="character-passive_wisdom" name="character-passive_wisdom" value="{{ character.passive_wisdom or '' }}" class="fixed-input">
            <label for="character-passive_wisdom">Passive Wisdom</label>
        </div>

        {# XP #}
        <div class="combat-xp-field">
            <input type="number" id="character-xp" name="character-xp" value="{{ character.xp or '' }}" class="fixed-input">
            <label for="character-xp">XP</label>
        </div>
    </div>
</div>
<br>
