<div class="classes-section">
    {% if classes %}
        {% for char_class in classes %}
        <div class="classes-section-row">
            <div class="classes-section-field classes-section-name-field">
                <label for="classes-class_name-{{ char_class.id }}" class="classes-section-label">Class Name</label>
                <input type="text" id="classes-class_name-{{ char_class.id }}"
                       name="classes-class_name-{{ char_class.id }}" value="{{ char_class.class_name | title() }}" readonly class="classes-section-input">
            </div>
            <div class="classes-section-field classes-section-level-field">
                <label for="classes-level-{{ char_class.id }}" class="classes-section-label">Level</label>
                <input type="number" id="classes-level-{{ char_class.id }}"
                       name="classes-level-{{ char_class.id }}" value="{{ char_class.level }}" class="classes-section-input class-level-input" data-original-value="{{ char_class.level }}" data-char-class-id="{{ char_class.id }}" hx-post="/characters/{{ character_id }}/classes/fragment" hx-target="#classes-section-container" hx-swap="innerHTML" hx-include="closest form" hx-trigger="change">
            </div>
            <div class="classes-section-field classes-section-action-field section-action-field">
                <button type="button" id="classes-action-{{ char_class.id }}"
                    data-remove-url="/characters/{{ character_id }}/class/{{ char_class.id }}/remove"
                        data-htmx-update-url="/characters/{{ character_id }}/classes/fragment"
                        hx-post="/characters/{{ character_id }}/class/{{ char_class.id }}/remove"
                        hx-target="#classes-section-container"
                        hx-swap="innerHTML"
                        hx-include="closest form"
                        class="classes-section-btn section-action-btn">−</button>
                <label for="classes-action-{{ char_class.id }}" id="classes-action-label-{{ char_class.id }}" class="classes-section-label section-action-label">Remove</label>
            </div>
        </div>
        {% endfor %}
    {% endif %}
</div>
