<div class="card-item-quantity-control" id="inventory-qty-control-{{ item.id }}" aria-label="Adjust quantity for {{ item.name }}">
    <button type="button" id="inventory-decrease-{{ item.id }}" class="field-btn card-item-btn card-item-quantity-btn" data-inventory-remove="true" data-item-quantity="{{ item.quantity }}"
        hx-post="/characters/{{ character_id }}/inventory/{{ item.id }}/step"
        hx-target="#inventory-qty-control-{{ item.id }}"
        hx-swap="outerHTML"
        hx-vals='{"inventory-step":"-1"}'>−</button>
    <input type="number" id="inventory-quantity-{{ item.id }}"
        name="inventory-quantity-{{ item.id }}" value="{{ item.quantity }}" class="field-input card-item-input card-item-quantity-display" min="0" readonly>
    <button type="button" id="inventory-increase-{{ item.id }}" class="field-btn card-item-btn card-item-quantity-btn"
        hx-post="/characters/{{ character_id }}/inventory/{{ item.id }}/step"
        hx-target="#inventory-qty-control-{{ item.id }}"
        hx-swap="outerHTML"
        hx-vals='{"inventory-step":"1"}'>+</button>
</div>
