{# OOB swap — replaces the <style> block so CSS vars update without a full reload #}
<style id="user-theme-vars" hx-swap-oob="outerHTML:#user-theme-vars">
:root {
    --primary-color: {{ colours.background_colour | e }};
    --secondary-color-dark: {{ colours.border_colour | e }};
    --label-colour: {{ colours.label_colour | e }};
    --tracker-fill-colour: {{ colours.tracker_fill_colour | e }};
    --text-colour-one: {{ colours.asterisk_colour | e }};
    --text-colour-three: {{ colours.field_text_colour | e }};
    --level-colour: {{ colours.level_colour | e }};
    --button-icon-colour: {{ colours.button_icon_colour | e }};
    --title-colour: {{ colours.title_colour | e }};
    --field-bg-colour: {{ colours.field_bg_colour | e }};
}
</style>
