<div class="{{ display_wrapper_classes }}{% if display_toggle %} proficiency-toggle-item{% endif %}"
    {% if display_toggle %}
    data-checkbox-id="{{ display_checkbox_id }}"
    role="button"
    tabindex="0"
    aria-pressed="{% if display_checkbox_checked %}true{% else %}false{% endif %}"
    {% endif %}>
    <div id="{{ display_value_id }}" class="{{ display_value_classes }}">{{ display_value if display_value is not none and display_value != '' else 0 }}</div>
    <div class="{{ display_label_classes }}">{{ display_label_text }}</div>
    {% if display_checkbox_name %}
    <input type="checkbox" id="{{ display_checkbox_id }}" name="{{ display_checkbox_name }}" value="1" {% if display_checkbox_checked %}checked{% endif %} class="hidden-proficiency-checkbox">
    {% endif %}
</div>
