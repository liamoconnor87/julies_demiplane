<div class="card-item-section feats-section">
    <h4>
        Feats & Traits
        <span id="feats-lock-toggle" class="section-lock-toggle" role="button" tabindex="0" aria-pressed="false" aria-label="Unlocked"><i class="bi bi-unlock-fill" aria-hidden="true"></i></span>
    </h4>
    <div id="feats-list">
    {% if feats_and_traits %}
        {% for feat in feats_and_traits %}
            {% include 'components/feat_row.html' %}
        {% endfor %}
    {% endif %}
    </div>

    {% if not feats_and_traits_at_capacity %}
    <div class="card-item-row card-item-add-row">
        <div class="card-item-top-row">
            <div class="card-item-field card-item-action-field section-action-field" id="add-feat-btn-wrapper">
                <button type="button" id="add-feat-btn" class="card-item-btn section-action-btn">+</button>
                <label for="add-feat-btn" class="card-item-label section-action-label">Add Feat</label>
            </div>

            <div class="card-item-field card-item-name-field" id="add-feat-field-name">
                <label for="feat_and_trait-name" class="card-item-label">New Feat/Trait</label>
                <input type="text" id="feat_and_trait-name"
                       name="feat_and_trait-name" placeholder="Enter name" class="card-item-input">
            </div>

            <div class="card-item-field card-item-action-field section-action-field" id="add-feat-submit-btn-wrapper">
                <button type="button" id="feat-and-trait-add" class="card-item-btn section-action-btn"
                        hx-post="/characters/{{ character_id }}/feat-and-trait/add"
                        hx-target="#feats-list"
                        hx-swap="beforeend"
                        hx-include="#feat_and_trait-name, #feat_and_trait-description"><i class="bi bi-check-lg"></i></button>
                <label for="feat-and-trait-add" class="card-item-label section-action-label">Add</label>
            </div>

            <div class="card-item-field card-item-action-field section-action-field" id="close-feat-btn-wrapper">
                <button type="button" id="close-feat-field-x-btn" class="card-item-btn section-action-btn">×</button>
                <label for="close-feat-field-x-btn" class="card-item-label section-action-label">Close</label>
            </div>
        </div>

        <div class="card-item-field card-item-description-field" id="add-feat-field-description">
            <label for="feat_and_trait-description" class="card-item-label">Description</label>
            <textarea id="feat_and_trait-description"
                      name="feat_and_trait-description" rows="3" placeholder="Enter description" class="card-item-input card-item-description-input"></textarea>
        </div>
    </div>
    {% endif %}
</div>
