<div id="inventory-row-{{ item.id }}" class="card-item-row card-item-saved-row">
    <div class="card-item-top-row">
        <div class="card-item-field card-item-name-field card-item-name-wrapper">
            <label for="inventory-name-{{ item.id }}" class="card-item-label">Item(s)</label>
            <input type="text" id="inventory-name-{{ item.id }}"
                name="inventory-name-{{ item.id }}" value="{{ item.name }}" class="card-item-input inventory-name-input"
                data-inventory-id="{{ item.id }}">
            <button type="button" id="inventory-delete-{{ item.id }}" class="section-remove-x" data-inventory-delete="true"
                hx-post="/characters/{{ character_id }}/inventory/{{ item.id }}/remove"
                hx-target="#inventory-row-{{ item.id }}"
                hx-swap="delete"
                aria-label="Remove item">&times;</button>
        </div>

        <div class="card-item-field card-item-quantity-field">
            <label for="inventory-quantity-{{ item.id }}" class="card-item-label">Qty</label>
                <div class="card-item-quantity-control" aria-label="Adjust quantity for {{ item.name }}">
                    <button type="button" id="inventory-decrease-{{ item.id }}" class="card-item-btn card-item-quantity-btn" data-inventory-remove="true" data-item-quantity="{{ item.quantity }}"
                        hx-post="/characters/{{ character_id }}/inventory/fragment"
                        hx-target="#inventory-section-container"
                        hx-swap="innerHTML"
                        hx-include="closest form"
                        hx-vals='{"inventory-action":"step","inventory-update-id":"{{ item.id }}","inventory-step":"-1"}'>−</button>
                    <input type="number" id="inventory-quantity-{{ item.id }}"
                        name="inventory-quantity-{{ item.id }}" value="{{ item.quantity }}" class="card-item-input card-item-quantity-display" min="0" readonly>
                    <button type="button" id="inventory-increase-{{ item.id }}" class="card-item-btn card-item-quantity-btn"
                        hx-post="/characters/{{ character_id }}/inventory/fragment"
                        hx-target="#inventory-section-container"
                        hx-swap="innerHTML"
                        hx-include="closest form"
                        hx-vals='{"inventory-action":"step","inventory-update-id":"{{ item.id }}","inventory-step":"1"}'>+</button>
                </div>
        </div>

    </div>

    <div class="card-item-field card-item-description-field">
        <textarea id="inventory-description-{{ item.id }}"
                  name="inventory-description-{{ item.id }}" rows="1" class="card-item-input card-item-description-input inventory-description-input"
                  data-inventory-id="{{ item.id }}">{{ item.description or '' }}</textarea>
    </div>
</div>
