<div id="character-level-field-container" class="character-info-main-field character-info-square-field character-info-level-field{% if not field_value or is_new_character %} d-none{% endif %}">
    <input type="number" id="{{ field_id }}" name="{{ field_name }}" value="{{ field_value or '' }}" disabled class="character-info-input">
    <label for="{{ field_id }}" class="character-info-label">{{ field_label }}</label>
</div>
